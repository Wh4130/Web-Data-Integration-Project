[project]
name = "web-data-integration-project"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "countryguess>=0.4.9",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2.0,<3.0.0",
    "pycountry>=24.6.1",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.5.0",
    "uma-pydi>=0.1.0",
]

[tool.uv.extra-build-dependencies]
htmlmin = ["legacy-cgi"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.5",
]
llm = [
    "langchain-openai>=0.3.0",
]
